name: E2E – Attribution

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  attribution-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Public values (safe to commit, but kept here for clarity).
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      # Private — required to create test partner + user and read across RLS.
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Tells Playwright where the dev server is (used by the lovable fixture).
      PLAYWRIGHT_BASE_URL: http://localhost:8080
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Verify required secrets are present
        run: |
          missing=0
          for v in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing required secret: $v"
              missing=1
            fi
          done
          exit $missing

      - name: Start Vite dev server
        run: |
          bun run dev > vite.log 2>&1 &
          echo $! > vite.pid

      - name: Wait for dev server
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080 > /dev/null; then
              echo "Dev server ready"; exit 0
            fi
            sleep 1
          done
          echo "::error::Dev server did not start in 60s"
          tail -n 100 vite.log
          exit 1

      - name: Run attribution E2E
        run: bunx playwright test tests/e2e/attribution.spec.ts --reporter=list,html

      - name: Stop dev server
        if: always()
        run: |
          if [ -f vite.pid ]; then kill "$(cat vite.pid)" 2>/dev/null || true; fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Upload dev server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vite-log
          path: vite.log
          retention-days: 7
